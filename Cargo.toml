[workspace]
members = ["crates/calibration-core", "crates/companion-cli", "crates/omniphony-adapter", "crates/measurement-capture", "crates/companion-service", "crates/companion-ui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
repository = "https://github.com/mgth/omniphony-companion"

[workspace.dependencies]
omniphony-adapter = { path = "crates/omniphony-adapter" }
omniphony-osc-contract = { git = "https://github.com/mgth/Omniphony", rev = "3174ea1f5cfebad6047a3ca1f5c43938f6487aa0", features = ["measurement"] }
calibration-core = { path = "crates/calibration-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
