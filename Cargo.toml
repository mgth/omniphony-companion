[workspace]
members = ["crates/calibration-core", "crates/companion-cli", "crates/omniphony-adapter", "crates/measurement-capture", "crates/companion-service", "crates/companion-ui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/mgth/omniphony-companion"

[workspace.dependencies]
omniphony-adapter = { path = "crates/omniphony-adapter" }
omniphony-osc-contract = { git = "https://github.com/mgth/Omniphony", rev = "c846887e662b1d7b63932a58e5a426b0e8cec250", features = ["measurement"] }
calibration-core = { path = "crates/calibration-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Signal analysis dominates test time: optimize it and its FFT in debug and test builds
# too, keeping debug assertions and overflow checks. Unoptimized, one offline
# reanalysis of a two-pass alignment takes about 20 s.
[profile.dev.package.measurement-capture]
opt-level = 2

[profile.dev.package.rustfft]
opt-level = 2

