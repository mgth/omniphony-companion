[workspace]
members = ["crates/calibration-core", "crates/companion-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
repository = "https://github.com/mgth/omniphony-companion"

[workspace.dependencies]
calibration-core = { path = "crates/calibration-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
