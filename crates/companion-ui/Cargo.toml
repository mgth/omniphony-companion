[package]
name = "companion-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Native egui frontend for Omniphony Companion"

[[bin]]
name = "omniphony-companion-ui"
path = "src/main.rs"

[dependencies]
calibration-core.workspace = true
companion-service = { path = "../companion-service" }
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[dev-dependencies]
measurement-capture = { path = "../measurement-capture" }
omniphony-adapter.workspace = true
tempfile = "3.23"

[lints]
workspace = true
